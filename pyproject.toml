[project]
name = "autonolas-analytics"
version = "0.1.0"
description = ""
authors = [{ name = "David Minarsch", email = "david.minarsch@googlemail.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "web3>=6.6.1,<7",
    "python-dotenv>=1.0.0,<2",
    "matplotlib>=3.8.0,<4",
    "pandas>=2.1.3,<3",
    "solana>=0.36.1,<0.40",
    "solders>=0.23,<0.28",
    "whirlpool-essentials>=0.0.5,<0.0.6",
    "anchorpy>=0.21,<0.22",
]

[dependency-groups]
dev = ["ruff>=0.6.0,<0.7"]

[tool.uv]
# This repo is a collection of standalone analytics scripts, not an installable
# package, so don't try to build/install the project itself.
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting.
select = ["E", "W", "F", "I"]
# E501 (line too long) is left to the formatter; scripts have long inline data/addresses.
ignore = ["E501", "E402"]
