[project]
name = "olas-governance"
version = "0.1.0"
description = "Cron-based monitoring and Telegram alerts for Olas DAO governance proposals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "requests>=2.31,<3",
    "web3>=7.15.0,<8",
]

[project.urls]
Repository = "https://github.com/dagacha/olas-governance"
Issues = "https://github.com/dagacha/olas-governance/issues"

[dependency-groups]
dev = ["ruff>=0.6.0,<0.7"]

[tool.uv]
# This repository deploys operational scripts rather than an installable Python package.
package = false

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting.
select = ["E", "W", "F", "I"]
# E501 (line too long) is left to the formatter; scripts have long inline data/addresses.
ignore = ["E501", "E402"]
